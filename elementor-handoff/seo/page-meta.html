<!--
  IMAI — page-level SEO meta block
  ================================
  These tags belong in the <head> of the page. In WordPress you have
  three options for where to put them:

  Option A (cleanest): use a SEO plugin's per-page fields
    - Yoast SEO:   page → Yoast SEO → Edit snippet → fill Title, Description,
                                                       Canonical, OG, Twitter
    - RankMath:    page → RankMath SEO → General + Social + Advanced tabs
    - AIOSEO:      page → AIOSEO Settings → fill the same fields
    Paste the values from the per-tag list below into the matching fields.

  Option B: theme header.php (developer install)
    Edit functions.php or header.php to add these tags inside <head>.
    Use wp_head() filter or copy the literal tags below into header.php.

  Option C: Insert Headers and Footers plugin
    Add the entire block below into "Scripts in Header".

  Whichever path you choose, swap "https://www.imai.com/" for your
  actual WordPress URL once known. The OG image URL also needs to point
  to a real uploaded image (1200x630 recommended).
-->

<!-- ============ Core SEO ============ -->
<title>IMAI · AI Influencer Marketing Platform | 400M+ Creators</title>
<meta name="description" content="IMAI is the #1 AI-powered influencer marketing platform. Find, evaluate, and activate creators from a database of 400M+ influencers across Instagram, TikTok, YouTube, and X. AI discovery, campaign management, ROI tracking, and creator payouts — all in one platform." />

<meta name="robots" content="index, follow, max-image-preview:large" />
