<!--
  IMAI — Schema.org JSON-LD structured data
  =========================================
  This is the GEO (Generative Engine Optimization) payload. It tells
  Google AI Overviews, ChatGPT Search, Perplexity, and Bing Copilot
  exactly what this page is so they can cite it confidently when users
  ask "what is the best AI influencer marketing platform" etc.

  Single @graph node packs 5 schema types:
    1. Organization         · IMAI Labs Inc. brand entity
    2. SoftwareApplication  · product with offers, ratings, features
    3. WebSite              · the landing page itself
    4. FAQPage              · all 11 FAQ Q&A pairs (mirrors the FAQ section)
    5. BreadcrumbList       · Home → (this page)

  Where to install:

  Option A — SEO plugin (cleanest)
    - Yoast SEO:   Yoast → Schema → "Custom" tab → paste below
    - RankMath:    page → RankMath SEO → Schema tab → add Custom Schema → paste
    - AIOSEO:      page → AIOSEO Settings → Schema → Add Schema → "Other" → paste

  Option B — header.php / footer.php
    Paste this entire file's content (script tag and all) into the theme's
    header.php just before </head>, or into the footer just before </body>.

  Option C — Already in full-landing.html
    If you used the HTML widget paste-and-go path, the same JSON-LD is
    already embedded at the bottom of full-landing.html. Don't double up;
    pick ONE location.

  Before going live, replace every "https://www.imai.com/" with your
  actual production URL. Google will reject the schema if URLs don't
  match the canonical.
-->
